  <style>
    .card-section {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: var(--pds-slide-pad-y) var(--pds-slide-pad-x);
      gap: var(--pds-space-lg);
    }
    .card-header {
      display: flex;
      flex-direction: column;
      gap: var(--pds-space-md);
    }
    .card-grid {
      display: flex;
      gap: var(--pds-space-lg);
      flex: 1;
      align-items: stretch;
    }
    .tile-row {
      display: flex;
      flex-direction: row;
      gap: 16px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    .tile {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      transition:
        flex-grow 0.6s cubic-bezier(0, 0, 0.2, 1),
        opacity 0.55s ease,
        transform 0.55s ease,
        filter 0.4s ease;
    }
    .tile.is-visible { opacity: 1; transform: none; }
    .tile-row:hover .tile { flex-grow: 0.85; }
    .tile-row:hover .tile:hover,
    .tile.is-active { flex-grow: 1.3; }
    .tile-poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: var(--img-pos, center);
      transform: scale(var(--img-scale, 1));
      transition: transform 1.2s cubic-bezier(0, 0, 0.2, 1);
    }
    /* Hover/active zoom multiplies on top of the saved framing scale. */
    .tile:hover .tile-poster,
    .tile.is-active .tile-poster { transform: scale(calc(var(--img-scale, 1) * 1.05)); }
    .tile-dim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .tile.is-active .tile-dim { opacity: 1; }
    .tile::before,
    .tile::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 2;
    }
    .tile::before {
      top: 0;
      height: 38%;
      background: linear-gradient(180deg, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.60) 30%, rgba(0,0,0,0.28) 65%, rgba(0,0,0,0) 100%);
    }
    .tile::after {
      bottom: 0;
      height: 62%;
      background: linear-gradient(0deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 22%, rgba(0,0,0,0.52) 48%, rgba(0,0,0,0.20) 78%, rgba(0,0,0,0) 100%);
    }
    .DesktopCarRangeTile__clickableArea__403b1 {
      position: absolute;
      inset: 0;
      z-index: 11;
      display: block;
      text-decoration: none;
    }
    .tile-signature {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      z-index: 6;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .tile-signature__mark {
      font-size: 14px;
      font-weight: var(--pds-font-weight-bold);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.8;
    }
    .tile-signature__divider {
      width: 28px;
      height: 2px;
      background: var(--pds-accent);
      margin-left: 14px;
      align-self: center;
    }
    .tile-content {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 36px;
      z-index: 13;
      display: flex;
      flex-direction: column;
      gap: 18px;
      color: #fff;
      pointer-events: none;
    }
    .tile-title {
      font-size: 38px;
      font-weight: var(--pds-font-weight-bold);
      line-height: 1.08;
      margin: 0;
      color: #fff;
    }
    .tile-bullets {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.55s cubic-bezier(0, 0, 0.2, 1), opacity 0.35s ease;
    }
    .tile.is-active .tile-bullets {
      max-height: 420px;
      opacity: 1;
    }
    .tile-bullets li {
      display: flex;
      gap: 10px;
      font-size: var(--pds-font-size-md);
      line-height: 1.45;
      color: rgba(255,255,255,0.88);
    }
    .tile-bullets li::before {
      content: '';
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pds-accent);
      margin-top: 9px;
    }
    .tile-cta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .tile:hover:not(.is-active) .tile-cta-row {
      opacity: 1;
      transform: none;
    }
    .tile.is-active .tile-cta-row {
      opacity: 0;
      transform: translateY(8px);
    }
    .tile-cta {
      font-size: var(--pds-font-size-xs);
      font-weight: var(--pds-font-weight-bold);
      letter-spacing: 0.14em;
      text-transform: uppercase;

    }
    .tile-cta__arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      color: #fff;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.3s ease;
    }
    .tile:hover .tile-cta__arrow,
    .tile.is-active .tile-cta__arrow {
      background: var(--pds-accent);
      border-color: var(--pds-accent);
      transform: translateX(3px);
    }
    .tile.visited .tile-signature__mark::after {
      content: ' ✓';
      color: var(--pds-success, #09D087);
      margin-left: 6px;
    }
    .tile.visited {
      box-shadow: inset 0 0 0 1.5px rgba(9, 208, 135, 0.55);
    }
    /* Legacy card selectors retained only for older hand-built slides. */
    .explore-card {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--pds-space-md);
      padding: var(--pds-space-xl);
      background: var(--pds-bg-surface);
      border: 1px solid var(--pds-border);
      border-radius: var(--pds-radius-xl);
      box-shadow: var(--pds-shadow-card);
      cursor: pointer;
      transition:
        background  var(--dur-fast) var(--ease-out),
        border-color var(--dur-fast) var(--ease-out),
        box-shadow  var(--dur-fast) var(--ease-out),
        transform   var(--dur-fast) var(--ease-out);
      overflow: hidden;
    }
    .explore-card:hover:not(.is-locked) {
      background: var(--pds-bg-surface-hover);
      border-color: var(--pds-border-strong);
      box-shadow: var(--pds-shadow-card), var(--pds-shadow-glow);
      transform: translateY(-2px);
    }
    .explore-card.is-visited {
      border-color: var(--pds-accent);
    }
    .explore-card.is-visited .card-chip {
      background: rgba(213, 0, 28, 0.20);
      color: var(--pds-accent);
    }
    .card-number {
      font-family: var(--pds-font-family);
      font-size: var(--pds-font-size-2xl);
      font-weight: var(--pds-font-weight-bold);
      line-height: 1;
      color: rgba(213, 0, 28, 0.20);
    }
    .card-media {
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 0 var(--pds-space-sm);
      border-radius: var(--pds-radius-lg);
      overflow: hidden;
      background: #16161a;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .card-title {
      font-family: var(--pds-font-family);
      font-size: var(--pds-font-size-xl);
      font-weight: var(--pds-font-weight-semibold);
      line-height: var(--pds-line-height-tight);
      color: var(--pds-text-primary);
    }
    .card-body {
      font-family: var(--pds-font-family);
      font-size: var(--pds-font-size-md);
      line-height: var(--pds-line-height-loose);
      color: var(--pds-text-secondary);
      flex: 1;
    }
    .card-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      align-self: flex-start;
      margin-top: auto;
      padding: 6px 14px;
      border-radius: var(--pds-radius-pill);
      background: var(--pds-bg-overlay);
      font-family: var(--pds-font-family);
      font-size: var(--pds-font-size-xs);
      font-weight: var(--pds-font-weight-semibold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--pds-text-muted);
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    /* Shimmer on unlocked unvisited cards */
    .explore-card:not(.is-locked):not(.is-visited).is-shimmer::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 30%,
        rgba(255,255,255,0.06) 50%,
        rgba(255,255,255,0) 70%
      );
      background-size: 400%;
      animation: shimmer 2.8s infinite linear;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="slide" data-slide-id="{{SLIDE_ID}}">

  <div class="card-section">

    <!-- Header -->
    <div class="card-header">
      <div class="pds-accent-bar anim-bar-grow" style="--anim-delay:0.1s;"></div>
      <h2 class="pds-heading-display anim-fade-up" style="--anim-delay:0.15s;">{{SLIDE_TITLE}}</h2>
      <p class="pds-body anim-fade-up" style="--anim-delay:0.2s;">{{ON_SCREEN_TEXT}}</p>
    </div>

    <!-- Cards grid — locked until INTRO VO ends -->
    <div class="tile-row intro-locked" id="card-grid">
      {{CARDS_HTML}}
    </div>

  </div>

</div>

<script src="../assets/vendor/gsap/gsap.min.js"></script>
<script src="../assets/vendor/porsche-components.js"></script>
<script>
/* ── SandboxRuntime shim ─────────────────────────────────────────────────── */
var SandboxRuntime = (function () {
  var CR = (function () {
    try { return window.parent && window.parent.CourseRuntime ? window.parent.CourseRuntime : null; }
    catch (_) { return null; }
  })();

  function makeFakeVO() {
    var listeners = {};
    var obj = {
      currentTime: 0,
      _wasPlaying: false,
      addEventListener: function (e, f) { (listeners[e] = listeners[e] || []).push(f); },
      removeEventListener: function (e, f) {
        if (listeners[e]) listeners[e] = listeners[e].filter(function (g) { return g !== f; });
      },
      _fire: function (e) { (listeners[e] || []).forEach(function (f) { f(); }); },
      play: function () { return Promise.resolve(); }
    };
    (function poll() {
      requestAnimationFrame(function () {
        if (CR) {
          obj.currentTime = CR.getAudioCurrentTime ? CR.getAudioCurrentTime() : 0;
          var p = CR.isAudioPlaying ? CR.isAudioPlaying() : false;
          if (!obj._wasPlaying && p) obj._wasPlaying = true;
          if (obj._wasPlaying && !p && obj.currentTime > 0) {
            if (!(document.querySelector('.slide') || {classList:{contains:function(){return false;}}}).classList.contains('is-paused')) {
              obj._wasPlaying = false;
              obj._fire('ended');
            }
          }
          obj._fire('timeupdate');
        }
        poll();
      });
    })();
    return obj;
  }

  function makeInteraction() {
    return {
      src: '',
      play: function () {
        if (CR && CR.playInteractionAudio) {
          CR.playInteractionAudio({ src: this.src });
        } else {
          var a = new Audio(this.src);
          a.play().catch(function () {});
        }
        return Promise.resolve();
      }
    };
  }

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'player-play-state') return;
    var s = document.querySelector('.slide');
    if (s) s.classList.toggle('is-paused', e.data.state === 'paused');
  });

  return { voAudio: makeFakeVO(), interactionAudio: makeInteraction() };
})();

/* ── Card interaction logic ──────────────────────────────────────────────── */
(function () {
  // Lock Next until all cards visited
  window.parent.postMessage({ type: 'sandbox-lock-next' }, '*');

  // Audio map: label → path  (injected by generator)
  var CARD_AUDIO = {{CARD_AUDIO_MAP}};
  var TOTAL_CARDS = {{TOTAL_CARDS}};
  var visited = new Set();
  var cardsUnlocked = false;
  var completingLabel = null;   // the click that completes the set; Next waits for its clip to end

  function hasPlayer() {
    try { return !!(window.parent && window.parent !== window && window.parent.CourseRuntime); }
    catch (_) { return false; }
  }
  // Route CLICK audio through the player so it emits player-interaction-ended.
  function playClickAudio(label, path) {
    if (!path) return;
    if (hasPlayer()) {
      window.parent.postMessage({
        type: 'sandbox-play-interaction', src: path, id: String(label),
        pauseNarration: true, resumeNarration: false,
        lockNext: false            // the slide-level sandbox-lock-next owns Next
      }, '*');
    } else {
      try { new Audio(path).play().catch(function () {}); } catch (_) {}
    }
  }

  // Entrance animations
  document.querySelectorAll('.anim-fade-up, .anim-bar-grow').forEach(function (el) {
    el.classList.add('is-visible');
  });

  function unlockCards() {
    if (cardsUnlocked) return;
    cardsUnlocked = true;
    var grid = document.getElementById('card-grid');
    if (grid) {
      grid.classList.remove('is-locked');
      grid.classList.add('is-visible');
    }
  }

  function onCardClick(cardEl, label) {
    if (!cardsUnlocked) return;

    document.querySelectorAll('.tile').forEach(function (t) {
      if (t !== cardEl) t.classList.remove('is-active');
    });
    cardEl.classList.add('is-active');

    // Revisiting a card must still show its text — the old early return bailed
    // before this point, leaving a visited card completely inert.
    if (visited.has(label)) return;

    // First visit only: the clip plays once per slide session. A revisit is for
    // re-reading the card, not for hearing the narration again.
    visited.add(label);
    cardEl.classList.add('visited');

    // Play CLICK audio
    var audioPath = CARD_AUDIO[label];
    playClickAudio(label, audioPath);

    // All cards visited → unlock Next, but only AFTER the final clip finishes
    // (the last clicked clip must play before Next enables — see COURSE-RULES).
    if (visited.size >= TOTAL_CARDS) {
      if (audioPath && hasPlayer()) completingLabel = String(label);
      else window.parent.postMessage({ type: 'sandbox-unlock-next' }, '*');
    }
  }

  // Release Next only once the completing card's VO has finished playing.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'player-interaction-ended') return;
    if (completingLabel != null && String(e.data.id) === completingLabel) {
      window.parent.postMessage({ type: 'sandbox-unlock-next' }, '*');
    }
  });

  // Wire up card click handlers
  document.querySelectorAll('.tile[data-card]').forEach(function (card, idx) {
    var label = card.getAttribute('data-card');
    card.addEventListener('click', function () { onCardClick(card, label); });
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        onCardClick(card, label);
      }
    });
    setTimeout(function () { card.classList.add('is-visible'); }, 260 + idx * 110);
  });

  // Unlock cards when INTRO VO ends
  setTimeout(function () {
    if (SandboxRuntime.voAudio) {
      SandboxRuntime.voAudio.addEventListener('ended', unlockCards);
      SandboxRuntime.voAudio.addEventListener('error', unlockCards);
    }
    // Local file fallback (no player)
    try {
      if (!window.parent || !window.parent.CourseRuntime) unlockCards();
    } catch (_) { unlockCards(); }
  }, 0);
})();
</script>
